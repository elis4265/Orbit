apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskflow.fullname" . }}-secrets
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "taskflow.databaseUrl" . | quote }}
  POSTGRES_URL: {{ include "taskflow.postgresUrl" . | quote }}
  REDIS_URL: {{ include "taskflow.redisUrl" . | quote }}
  MINIO_ACCESS_KEY: {{ include "taskflow.minioAccessKey" . | quote }}
  MINIO_SECRET_KEY: {{ include "taskflow.minioSecretKey" . | quote }}
  JWT_SECRET_KEY: {{ required "secrets.jwtSecretKey is required" .Values.secrets.jwtSecretKey | quote }}
  HOCUSPOCUS_INTERNAL_KEY: {{ required "secrets.hocuspocusInternalKey is required" .Values.secrets.hocuspocusInternalKey | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  BREVO_API_KEY: {{ .Values.secrets.brevoApiKey | quote }}
  ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
