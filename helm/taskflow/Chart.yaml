apiVersion: v2
name: taskflow
description: Self-hosted SaaS Kanban task manager — FastAPI + React + Hocuspocus
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - kanban
  - task-manager
  - saas
dependencies:
  - name: postgresql
    version: "15.5.22"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "20.1.6"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: minio
    version: "14.7.13"
    repository: "https://charts.bitnami.com/bitnami"
    condition: minio.enabled
