name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: taskflow-backend

jobs:
  # ── Unit tests + coverage ────────────────────────────────────────────────────
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: taskflow-backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Fast feedback — runs unit tests + reports coverage, but the coverage GATE
      # lives in the integration job (measured over unit+integration combined, since
      # the API routers are exercised by integration tests, not unit).
      - name: Run unit tests with coverage
        env:
          PYTHONPATH: "."
          DATABASE_URL: postgresql+asyncpg://dummy:dummy@localhost:5432/dummy
          JWT_SECRET_KEY: ci-test-secret-32chars-placeholder
          OPENAI_API_KEY: sk-test
          ALLOWED_ORIGINS: '["http://localhost:3000"]'
        run: pytest tests/unit -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: taskflow-backend/coverage.xml
          fail_ci_if_error: false

  # ── Integration tests (Testcontainers + Redis service) ──────────────────────
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: taskflow-backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Coverage GATE. Runs unit + integration together so the API routers/repos
      # (exercised by integration, not unit) count toward the total.
      - name: Run integration tests + combined coverage gate
        env:
          PYTHONPATH: "."
          USE_TESTCONTAINERS: "1"
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          JWT_SECRET_KEY: ci-test-secret-32chars-placeholder
          OPENAI_API_KEY: sk-test
          REDIS_URL: redis://localhost:6379/0
          ALLOWED_ORIGINS: '["http://localhost:3000"]'
        run: pytest tests/unit tests/integration -v --cov=app --cov-report=term-missing --cov-fail-under=80

  # ── Frontend typecheck + unit tests ──────────────────────────────────────────
  frontend:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taskflow-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: taskflow-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + build
        run: npm run build

      - name: Run unit tests
        run: npx vitest run

  # ── Load test (headless Locust against live backend) ─────────────────────────
  load:
    name: Load test
    runs-on: ubuntu-latest
    needs: [unit, integration]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow_pass
          POSTGRES_DB: taskflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: taskflow-backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt locust>=2.29.0

      - name: Run Alembic migrations
        env:
          PYTHONPATH: "."
          DATABASE_URL: postgresql+asyncpg://taskflow:taskflow_pass@localhost:5432/taskflow_ci
          JWT_SECRET_KEY: ci-test-secret-32chars-placeholder
          OPENAI_API_KEY: sk-test
          ALLOWED_ORIGINS: '["http://localhost:3000"]'
        run: alembic upgrade head

      - name: Start backend
        env:
          PYTHONPATH: "."
          DATABASE_URL: postgresql+asyncpg://taskflow:taskflow_pass@localhost:5432/taskflow_ci
          JWT_SECRET_KEY: ci-test-secret-32chars-placeholder
          OPENAI_API_KEY: sk-test
          REDIS_URL: redis://localhost:6379/0
          ALLOWED_ORIGINS: '["http://localhost:3000"]'
          ENVIRONMENT: development
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          echo $! > /tmp/uvicorn.pid
          sleep 5
          curl -sf http://localhost:8000/health || (echo "Backend failed to start" && exit 1)

      - name: Run Locust headless (50 users, 60s)
        env:
          # Raise threshold for CI — containers add overhead vs bare metal
          LATENCY_THRESHOLD_MS: "500"
        run: |
          locust -f locustfile.py \
            --headless \
            --users 50 \
            --spawn-rate 10 \
            --run-time 60s \
            --host http://localhost:8000 \
            --html reports/locust.html \
            --csv reports/locust

      - name: Upload Locust report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: locust-report
          path: taskflow-backend/reports/locust*

  # ── Secret scanning ──────────────────────────────────────────────────────────
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action is a composite action; the repo-level working-directory
    # default does not apply to it, so it scans from the repository root.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so a secret in any commit is caught
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
