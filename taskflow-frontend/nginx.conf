server {
    listen 80;

    # Cookies are scoped by host, not port, so every app a developer runs on
    # localhost shares one jar — and corporate proxies inject large headers too.
    # nginx's 8k default rejects those with "400 Request Header Or Cookie Too Large"
    # before the request ever reaches the app.
    # A single header must fit in ONE buffer, so the 32k size is what fixes this;
    # 4 buffers is ample and halves the worst-case memory per connection.
    large_client_header_buffers 4 32k;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's internal DNS so upstreams are resolved per-request,
    # not at nginx startup (prevents "host not found" when containers start in parallel)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # Backend WebSocket (project socket: planning poker, live notifications,
    # task/comment broadcasts). Longer prefix than /api/ so it wins; needs the
    # Upgrade headers the plain /api/ location omits.
    location /api/v1/ws/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # Proxy API requests to the backend container
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy WebSocket connections for Hocuspocus
    location /ws {
        set $hocuspocus http://hocuspocus:1234;
        proxy_pass $hocuspocus;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # SPA fallback — all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (Vite hashes filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
